[package]
name = "iroh-gateway-edge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
humantime.workspace = true
iroh.workspace = true
iroh-gateway-proto = { path = "../proto" }
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
nix = { workspace = true, features = ["resource"] }
prometheus.workspace = true
socket2.workspace = true

[dev-dependencies]
fastrand.workspace = true
nix.workspace = true
socket2.workspace = true
tempfile.workspace = true
iroh = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["io-util", "time"] }

[[bin]]
name = "iroh-gateway-edge"
path = "src/main.rs"
