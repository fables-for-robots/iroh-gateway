name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: iroh port mapping stays compiled out
        run: |
          if cargo tree --workspace -e normal,dev --prefix none | grep -q '^portmapper '; then
            echo "iroh portmapper must stay disabled"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    # audit-check reports its results as a check run, which needs an
    # explicitly granted write scope on the default read-only token.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5

      - name: Audit dependencies against the RustSec advisory database
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
