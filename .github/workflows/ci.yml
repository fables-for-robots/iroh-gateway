name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The operator's HAProxy supervisor tests run the real binary.
      - name: Install HAProxy 3.2
        run: |
          sudo add-apt-repository -y ppa:vbernat/haproxy-3.2
          sudo apt-get update
          sudo apt-get install -y haproxy=3.2.\*
          # The package starts a system service; the tests need only the binary.
          sudo systemctl disable --now haproxy || true
          haproxy -v

      - name: Tests
        run: cargo test --workspace

      # The operator's cluster tests run a real kube-apiserver and etcd, which
      # setup-envtest downloads into target/envtest/.
      - name: Cluster tests
        shell: bash
        run: |
          set -euo pipefail
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          assets="$(scripts/envtest-assets)"
          test -n "$assets"
          KUBEBUILDER_ASSETS="$assets" cargo test -p iroh-gateway-operator --test cluster -- --ignored

      - name: CRD manifest is up to date
        shell: bash
        run: |
          set -euo pipefail
          cargo run -q -p iroh-gateway-operator --bin crdgen > "$RUNNER_TEMP/crd.yaml"
          diff "$RUNNER_TEMP/crd.yaml" deploy/crd.yaml

      - name: iroh port mapping stays compiled out
        shell: bash
        run: |
          set -euo pipefail
          tree="$RUNNER_TEMP/cargo-tree.txt"
          # Its own command, so a failing `cargo tree` fails the step instead of passing it.
          cargo tree --workspace --target all -e normal,dev --prefix none > "$tree"
          if ! grep -q '^iroh ' "$tree"; then
            echo "cargo tree output does not list iroh; the check would be vacuous"
            exit 1
          fi
          if grep -q '^portmapper ' "$tree"; then
            echo "iroh portmapper must stay disabled"
            exit 1
          fi

  e2e-kind:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the operator image
        run: docker build --target operator -t iroh-gateway-operator:e2e .

      - name: Build the edge image
        run: docker build --target edge -t iroh-gateway-edge:e2e .

      - uses: helm/kind-action@v1
        with:
          cluster_name: iroh-gateway-e2e

      - name: Load the images into kind
        run: |
          kind load docker-image iroh-gateway-operator:e2e --name iroh-gateway-e2e
          kind load docker-image iroh-gateway-edge:e2e --name iroh-gateway-e2e

      - name: End-to-end test
        run: scripts/e2e-kind.sh

  audit:
    runs-on: ubuntu-latest
    # audit-check reports its results as a check run, which needs an
    # explicitly granted write scope on the default read-only token.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5

      - name: Audit dependencies against the RustSec advisory database
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
