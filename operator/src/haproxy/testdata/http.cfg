global
    log stdout format raw local0
    stats socket /run/igw/stats.sock mode 600 level admin expose-fd listeners
    maxconn 8192
    hard-stop-after 30m
    mworker-max-reloads 50

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-request 10s
    timeout http-keep-alive 60s

frontend idle
    bind unix@/run/igw/s/idle.sock mode 600
    tcp-request connection reject

# gw/public port 80
frontend fe_473034e7d07ecf67
    mode http
    bind unix@/run/igw/s/473034e7d07ecf67.sock accept-proxy mode 600
    option httplog
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto http
    use_backend be_473034e7d07ecf67_0 if { req.hdr(host),host_only,lower -m str -- 'a.example.com' } { path -m str -- '/x' }
    use_backend be_473034e7d07ecf67_1 if { req.hdr(host),host_only,lower -m str -- 'a.example.com' } { path -m str -- '/api' } { method 'GET' } { req.fhdr(x-env) -m str -- 'prod' }
    use_backend be_473034e7d07ecf67_1 if { req.hdr(host),host_only,lower -m str -- 'a.example.com' } { path -m beg -- '/api/' } { method 'GET' } { req.fhdr(x-env) -m str -- 'prod' }
    use_backend be_473034e7d07ecf67_2 if { req.hdr(host),host_only,lower -m end -- '.example.com' }
    use_backend be_473034e7d07ecf67_3 if { path -m str -- '/fail' }
    use_backend be_473034e7d07ecf67_3 if { path -m beg -- '/fail/' }
    use_backend be_473034e7d07ecf67_0
    default_backend be_473034e7d07ecf67_none

backend be_473034e7d07ecf67_0
    mode http
    http-request set-header 'x-a' '100%%'
    http-request add-header 'x-b' '2'
    http-request del-header 'x-c'
    http-response set-header 'x-d' '4'
    http-response add-header 'x-e' '5'
    http-response del-header 'server'
    server s0 10.0.0.1:8080 weight 85
    server s1 10.0.0.2:8080 weight 256

backend be_473034e7d07ecf67_1
    mode http
    server s0 [fd00::12]:8080 weight 256

backend be_473034e7d07ecf67_2
    mode http
    http-request redirect location 'https://%[req.hdr(host),host_only]%[pathq]' code 301

backend be_473034e7d07ecf67_3
    mode http
    http-request return status 500

backend be_473034e7d07ecf67_none
    mode http
    http-request return status 404
