global
    log stdout format raw local0
    stats socket /run/igw/stats.sock mode 600 level admin expose-fd listeners
    maxconn 8192
    hard-stop-after 5m

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend idle
    bind unix@/run/igw/s/idle.sock mode 600
    tcp-request connection reject
