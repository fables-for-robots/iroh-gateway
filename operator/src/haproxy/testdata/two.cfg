global
    log stdout format raw local0
    stats socket /run/igw/stats.sock mode 600 level admin expose-fd listeners
    hard-stop-after 5m

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend idle
    bind unix@/run/igw/s/idle.sock mode 600
    tcp-request connection reject

# a/x port 80
frontend fe_e71bb2479068a25a
    bind unix@/run/igw/s/e71bb2479068a25a.sock accept-proxy mode 600
    default_backend be_e71bb2479068a25a

backend be_e71bb2479068a25a
    server s0 10.0.0.1:80 weight 256

# a/x port 443
frontend fe_b828c32db7a97ea2
    bind unix@/run/igw/s/b828c32db7a97ea2.sock accept-proxy mode 600
    default_backend be_b828c32db7a97ea2

backend be_b828c32db7a97ea2
    server s0 10.0.0.1:443 weight 256

# b/y port 5432
frontend fe_c9210013fc1ce25b
    bind unix@/run/igw/s/c9210013fc1ce25b.sock accept-proxy mode 600
    default_backend be_c9210013fc1ce25b

backend be_c9210013fc1ce25b
    server s0 [fd00::12]:5432 weight 256
