global
    log stdout format raw local0
    stats socket /run/igw/stats.sock mode 600 level admin expose-fd listeners
    maxconn 8192
    hard-stop-after 30m
    mworker-max-reloads 50

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-request 10s
    timeout http-keep-alive 60s
    timeout client-hs 10s

frontend idle
    bind unix@/run/igw/s/idle.sock mode 600
    tcp-request connection reject

# gw/public port 443
frontend fe_a43c3fd7a81ccec0
    mode http
    bind unix@/run/igw/s/a43c3fd7a81ccec0.sock accept-proxy mode 600 ssl crt-list /run/igw/certs/a43c3fd7a81ccec0.a372a6265b8479fc.list strict-sni ssl-min-ver TLSv1.2 alpn h2,http/1.1
    option httplog
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request del-header Forwarded
    http-request del-header X-Real-IP
    use_backend be_a43c3fd7a81ccec0_0
    default_backend be_a43c3fd7a81ccec0_none

backend be_a43c3fd7a81ccec0_0
    mode http
    server s0 10.0.0.1:8443 weight 256

backend be_a43c3fd7a81ccec0_none
    mode http
    http-request return status 404
