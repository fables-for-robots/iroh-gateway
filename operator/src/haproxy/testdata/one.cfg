global
    log stdout format raw local0
    stats socket /run/igw/stats.sock mode 600 level admin expose-fd listeners
    maxconn 8192
    hard-stop-after 30m
    mworker-max-reloads 50

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    timeout http-request 10s
    timeout http-keep-alive 60s
    timeout client-hs 10s

frontend idle
    bind unix@/run/igw/s/idle.sock mode 600
    tcp-request connection reject

frontend metrics
    mode http
    bind unix@/run/igw/metrics.sock mode 600
    acl metrics_path path /metrics
    http-request use-service prometheus-exporter if metrics_path
    no log

# gw/public port 5432
frontend fe_7903a80c6832446b
    bind unix@/run/igw/s/7903a80c6832446b.sock accept-proxy mode 600
    default_backend be_7903a80c6832446b

backend be_7903a80c6832446b
    server s0 10.0.0.1:5432 weight 85
    server s1 10.0.0.2:5432 weight 256
