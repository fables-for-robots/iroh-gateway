[package]
name = "iroh-gateway-operator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
fastrand.workspace = true
futures.workspace = true
gateway-api.workspace = true
hex.workspace = true
iroh.workspace = true
iroh-gateway-proto = { path = "../proto" }
k8s-openapi.workspace = true
kube.workspace = true
prometheus.workspace = true
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
nix = { workspace = true, features = ["resource"] }

[dev-dependencies]
nix.workspace = true
socket2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
iroh = { workspace = true, features = ["test-utils"] }
iroh-gateway-edge = { path = "../edge" }
