[package]
name = "iroh-gateway-operator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
fastrand.workspace = true
iroh.workspace = true
iroh-gateway-proto = { path = "../proto" }
serde.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
nix.workspace = true
socket2.workspace = true
tempfile.workspace = true
iroh = { workspace = true, features = ["test-utils"] }
iroh-gateway-edge = { path = "../edge" }
tokio = { workspace = true, features = ["io-util", "time"] }

[[bin]]
name = "iroh-gateway-operator"
path = "src/main.rs"
