[workspace]
resolver = "3"
members = ["proto", "edge", "operator"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fables-for-robots/iroh-gateway"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ciborium = "0.2"
fastrand = "2"
futures = "0.3"
gateway-api = "0.23"
hex = "0.4"
humantime = "2"
iroh = { version = "1", default-features = false, features = ["fast-apple-datapath", "tls-ring"] }
k8s-openapi = { version = "0.29", features = ["latest", "schemars"] }
kube = { version = "5.1", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "ring"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1.50", features = ["io-util", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.30", default-features = false, features = ["signal"] }
