[workspace]
resolver = "3"
members = ["proto", "edge"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fables-for-robots/iroh-gateway"

[workspace.dependencies]
anyhow = "1"
ciborium = "0.2"
hex = "0.4"
iroh = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.50", features = ["io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
