[workspace]
resolver = "3"
members = ["proto", "edge", "operator"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fables-for-robots/iroh-gateway"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ciborium = "0.2"
fastrand = "2"
hex = "0.4"
humantime = "2"
iroh = { version = "1", default-features = false, features = ["fast-apple-datapath", "tls-ring"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1.50", features = ["io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.30", default-features = false, features = ["signal"] }
