[workspace]
resolver = "3"
members = ["proto"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fables-for-robots/iroh-gateway"

[workspace.dependencies]
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }
