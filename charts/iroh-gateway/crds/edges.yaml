apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edges.gateway.fables-for-robots.ch
spec:
  group: gateway.fables-for-robots.ch
  names:
    kind: Edge
    plural: edges
    shortNames:
    - edge
    singular: edge
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gatewayRef.name
      name: Gateway
      type: string
    - jsonPath: .status.conditions[?(@.type=="Connected")].status
      name: Connected
      type: string
    - jsonPath: .status.path
      name: Path
      type: string
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for EdgeSpec via `CustomResource`
        properties:
          spec:
            description: What the operator is told about one edge machine.
            properties:
              address:
                description: 'Where the operator dials the edge: an IP or DNS name with a port.'
                nullable: true
                type: string
              endpointId:
                description: The edge's public key.
                type: string
              gatewayRef:
                description: The `Gateway` this edge serves, in the same namespace.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              publicAddresses:
                description: Addresses visitors use; defaults to the IP in `address`.
                items:
                  type: string
                type: array
            required:
            - endpointId
            - gatewayRef
            type: object
          status:
            description: What the operator observed about an edge.
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              gatewayEndpointId:
                description: The operator's public key, which the edge must trust.
                nullable: true
                type: string
              listeners:
                default: []
                items:
                  description: Whether one public listener on the edge is bound.
                  properties:
                    bound:
                      type: boolean
                    message:
                      nullable: true
                      type: string
                    port:
                      format: uint16
                      maximum: 65535.0
                      minimum: 0.0
                      type: integer
                    protocol:
                      type: string
                  required:
                  - bound
                  - port
                  - protocol
                  type: object
                type: array
              path:
                description: |-
                  The kind of path the operator sends to the edge on at the moment: `direct` or `relay`.
                  Unset while the edge is not connected.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Edge
        type: object
    served: true
    storage: true
    subresources:
      status: {}
