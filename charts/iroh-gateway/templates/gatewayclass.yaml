{{- if .Values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{- include "iroh-gateway.labels" . | nindent 4 }}
spec:
  # The operator serves the Gateways of every class with this controllerName.
  controllerName: {{ .Values.controllerName }}
{{- end }}
