{{- if .Values.networkPolicy.enabled }}
# Ingress to the operator pod only on the metrics port, which the kubelet's probes use too.
# The operator needs no other ingress: it dials the edges, and the replies to that and to its
# connections to the backends are admitted as part of those connections. Egress is open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iroh-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iroh-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iroh-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
